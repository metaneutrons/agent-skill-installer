# Started only by release-please.yml, dispatched against the tag it just
# created. No tag trigger of its own, so no second pipeline starts for the same
# tag.
#
# Order: establish the identity, build the candidate once, prove the crates.io
# publishing path without changing anything, attach the candidate to the draft
# release and read it back, publish the very same bytes to crates.io and read
# them back, and only then make the release public.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Establish the release identity
    runs-on: ubuntu-24.04
    outputs:
      crate: ${{ steps.identity.outputs.crate }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - name: Match tag, manifest and release-please
        id: identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "::error::Dispatch this workflow on a tag, not on $GITHUB_REF_TYPE $GITHUB_REF_NAME."
            exit 1
          fi
          meta=$(cargo metadata --no-deps --format-version 1 --locked)
          crate=$(jq -r '.packages[0].name' <<<"$meta")
          version=$(jq -r '.packages[0].version' <<<"$meta")
          manifest=$(jq -r '."."' .release-please-manifest.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version."
            exit 1
          fi
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::release-please manifest says $manifest, Cargo.toml says $version."
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "::error::$version is a prerelease; this pipeline publishes stable versions only."
            exit 1
          fi
          {
            echo "crate=$crate"
            echo "version=$version"
            echo "tag=$GITHUB_REF_NAME"
          } >> "$GITHUB_OUTPUT"

  candidate:
    name: Build the crate candidate
    needs: [metadata]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - name: Package and checksum
        env:
          CRATE: ${{ needs.metadata.outputs.crate }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          cargo package --locked
          mkdir release
          cp "target/package/${CRATE}-${VERSION}.crate" release/
          (cd release && sha256sum "${CRATE}-${VERSION}.crate" > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7

  # Changes nothing: issues a short-lived crates.io token through trusted
  # publishing and discards it, which proves exactly the path the publish job
  # takes later. Also refuses to go on unless the draft release exists.
  preflight:
    name: Prove the publishing path
    needs: [metadata]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Require the token and the draft
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft)
          if [[ "$draft" != true ]]; then
            echo "::error::Release $TAG is not a draft ($draft); release-please creates it as one."
            exit 1
          fi

  stage:
    name: Attach the candidate to the draft
    needs: [metadata, candidate, preflight]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-candidate
          path: release
      - name: Upload and read back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          gh release upload "$TAG" release/* --clobber
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          for file in release/*; do
            cmp "$file" "downloaded/$(basename "$file")"
          done

  publish:
    name: Publish to crates.io
    needs: [metadata, candidate, preflight, stage]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-candidate
          path: candidate
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish the verified bytes
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ needs.metadata.outputs.crate }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          crate="${CRATE}-${VERSION}.crate"
          (cd candidate && sha256sum --check SHA256SUMS)
          # The publish packages again; it has to be the candidate, byte for
          # byte, or this is not the crate that was checked.
          cargo package --locked
          test "$(sha256sum "target/package/$crate" | cut -d ' ' -f 1)" = \
            "$(cut -d ' ' -f 1 candidate/SHA256SUMS)"
          cargo publish --locked
      - name: Read the published crate back
        env:
          CRATE: ${{ needs.metadata.outputs.crate }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          crate="${CRATE}-${VERSION}.crate"
          url="https://static.crates.io/crates/${CRATE}/${crate}"
          # The upload is accepted before the file is served; waiting for it
          # is reading back, not retrying the publish.
          for _ in $(seq 1 30); do
            if curl -fsSL -A "agent-skill-installer release (github.com/${GITHUB_REPOSITORY})" \
                 "$url" -o published.crate; then
              break
            fi
            sleep 10
          done
          test -s published.crate
          cmp published.crate "candidate/$crate"

  promote:
    name: Make the release public
    needs: [metadata, publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Publish the draft and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          gh api "repos/${GH_REPO}/releases/latest" \
            | jq --exit-status --arg tag "$TAG" \
                '.tag_name == $tag and .draft == false and .prerelease == false' \
            > /dev/null
