[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Fabian Schmieder"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/metaneutrons/agent-skill-installer"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[package]
name = "agent-skill-installer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Install an Agent Skill into the skill directories of AI coding tools, with consent and safe updates"
readme = "README.md"
keywords = ["agent-skills", "ai", "claude", "codex", "installer"]
categories = ["development-tools", "filesystem"]

[lints]
workspace = true

[dependencies]

[dev-dependencies]
tempfile = "3"
